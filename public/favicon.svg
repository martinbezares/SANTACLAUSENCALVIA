<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A0F1A"/>
      <stop offset="100%" stop-color="#5E0810"/>
    </linearGradient>
    <!-- Hat gradient -->
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E52B38"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <!-- Beard gradient -->
    <linearGradient id="beardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECEFF1"/>
    </linearGradient>
    <!-- Soft shadow filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular Festive Badge (ensures high contrast in both dark and light browser tabs) -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#F59E0B" stroke-width="2"/>

  <!-- Santa Hat (Back & Main Cone) -->
  <path d="M 18 24 Q 28 8 46 14 Q 52 18 52 24 Q 44 21 34 22 Z" fill="url(#hatGrad)" filter="url(#softShadow)"/>
  
  <!-- Hat Pom-Pom hanging to the right -->
  <circle cx="51" cy="25" r="4.5" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.8" filter="url(#softShadow)"/>

  <!-- Santa Face -->
  <ellipse cx="32" cy="30" rx="13" ry="11" fill="#FCE4D6"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="23.5" cy="31" rx="3" ry="2" fill="#FF8A80" opacity="0.6"/>
  <ellipse cx="40.5" cy="31" rx="3" ry="2" fill="#FF8A80" opacity="0.6"/>

  <!-- Cheerful Eyes (Happy Arcs) -->
  <path d="M 24 27.5 Q 26.5 25 29 27.5" fill="none" stroke="#261C14" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 35 27.5 Q 37.5 25 40 27.5" fill="none" stroke="#261C14" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Friendly Nose -->
  <ellipse cx="32" cy="30" rx="2.5" ry="2" fill="#F8BBD0"/>

  <!-- Hat White Fur Trim -->
  <rect x="15" y="21" width="34" height="6.5" rx="3.25" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.8" filter="url(#softShadow)"/>

  <!-- Big Fluffy Beard -->
  <path d="M 19 32 
           C 16 41, 20 54, 32 55 
           C 44 54, 48 41, 45 32 
           C 43 36, 40 38, 38 38 
           C 36 38, 34 36, 32 37 
           C 30 36, 28 38, 26 38 
           C 24 38, 21 36, 19 32 Z" 
        fill="url(#beardGrad)" stroke="#CFD8DC" stroke-width="0.8" filter="url(#softShadow)"/>

  <!-- Fluffy Mustache -->
  <path d="M 32 32 
           C 29 30, 22 30, 19 34 
           C 23 37, 28 36, 32 34 
           C 36 36, 41 37, 45 34 
           C 42 30, 35 30, 32 32 Z" 
        fill="#FFFFFF" stroke="#CFD8DC" stroke-width="0.8"/>
  
  <!-- Tiny Festive Gold Star Sparkle on the hat -->
  <path d="M 23 15 L 24 17 L 26 17 L 24.5 18.5 L 25 21 L 23 19.5 L 21 21 L 21.5 18.5 L 20 17 L 22 17 Z" fill="#FDE047" opacity="0.9"/>
</svg>
